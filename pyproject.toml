[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "depibeans"
version = "0.3.0"
description = "DEPI controller migration foundation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["depibeans*"]

[tool.setuptools.package-data]
depibeans = ["ui/dist/*"]

[project.optional-dependencies]
portal = ["Flask>=3.1,<4", "waitress>=3,<4"]
analysis = ["numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-image>=0.22,<1", "tifffile>=2024.2", "pillow>=10,<13"]
